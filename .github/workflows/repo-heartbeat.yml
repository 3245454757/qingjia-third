name: Repo Heartbeat

on:
  schedule:
    - cron: '0 4 * * 1'   # 每周一 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    name: Commit heartbeat file
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Write heartbeat and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 使用 token 的 remote，确保能 push
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          echo "heartbeat: $(cat .github/heartbeat.txt)"

          git pull --rebase origin main || true
          git add .github/heartbeat.txt
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: keepalive heartbeat $(date -u +%Y-%m-%d)"
          git push

# 用途：每周自动提交一次心跳文件，避免仓库因长时间无提交被 GitHub 自动禁用定时 workflow；同时保证 supabase-keepalive 持续生效。
