<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            max-width: 414px;
            margin: 0 auto;
            -webkit-font-smoothing: antialiased;
            color: #2c3138;
        }

        .header {
            background: #fff;
            color: #2c3138;
            padding: 12px 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eef0f3;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .back-btn {
            background: #f0f2f5;
            color: #666;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #2c3138;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-name {
            font-size: 13px;
            color: #888;
        }

        .logout-btn {
            background: #f0f2f5;
            color: #666;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .logout-btn:hover { background: #e6e9ee; }

        /* A5 页签吸顶：top 取顶部固定栏 .header 的实测高度（--tabs-top，避免被 header 压住） */
        .tabs {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: var(--tabs-top, 0px);
            z-index: 9;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab.active {
            color: #5a9cf5;
            border-bottom-color: #5a9cf5;
            font-weight: 600;
        }

        .tab-content {
            display: none;
            padding: 16px;
        }

        .tab-content.active {
            display: block;
        }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .stat-number {
            font-size: 24px;
            font-weight: 700;
            color: #5a9cf5;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .user-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .user-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .user-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .status-pending { background: #fef3e2; color: #f39c12; }
        .status-approved { background: #e8f8ef; color: #27ae60; }
        .status-rejected { background: #fdeaea; color: #e74c3c; }
        .status-disabled { background: #eef0f3; color: #909399; }

        .invite-tag {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .user-meta {
            font-size: 12px;
            color: #aaa;
            display: flex;
            gap: 16px;
            margin-bottom: 10px;
        }

        .note-section { margin-top: 8px; }
        .note-section label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            display: block;
        }

        .note-input-row {
            display: flex;
            gap: 8px;
        }

        .note-input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .note-input:focus { border-color: #5a9cf5; }

        .note-save-btn {
            padding: 8px 14px;
            background: #5a9cf5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        .note-save-btn:hover { background: #4a8ce4; }

        .user-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-approve {
            flex: 1;
            padding: 8px;
            background: #27ae60;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-approve:hover { background: #219a52; }

        .btn-reject {
            flex: 1;
            padding: 8px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-reject:hover { background: #c0392b; }

        .empty-tip {
            text-align: center;
            color: #aaa;
            padding: 40px 0;
            font-size: 14px;
        }

        .export-btn {
            padding: 6px 14px;
            background: #5a9cf5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .export-btn:hover { background: #4a8ce4; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .log-item {
            background: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            font-size: 13px;
        }

        .log-user { font-weight: 600; color: #333; }
        .log-time { color: #aaa; font-size: 12px; }

        /* ===== 绑定信息 / 登录记录 / 邀请码 ===== */
        .device-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            color: #6b7280;
            word-break: break-all;
        }

        .bind-line {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .log-item { display: block; }

        .log-line-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .log-result { font-size: 12px; font-weight: 600; }
        .log-result.ok { color: #27ae60; }
        .log-result.fail { color: #e74c3c; }

        .log-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 11px;
            color: #9aa0a6;
            line-height: 1.7;
        }

        .invite-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .invite-toolbar select,
        .invite-toolbar input {
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            color: #333;
            background: #fff;
            box-sizing: border-box;
        }

        .invite-toolbar input { flex: 1; min-width: 120px; }

        .invite-toolbar button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #5a9cf5;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }

        .invite-gen-list { margin-bottom: 14px; }

        .invite-gen-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #f7f9fc;
            border: 1px dashed #cfe0fb;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .invite-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
            color: #2c3138;
            letter-spacing: .5px;
            word-break: break-all;
        }

        .invite-copy-btn {
            flex: none;
            padding: 5px 12px;
            border: 1px solid #cfe0fb;
            border-radius: 8px;
            background: #fff;
            color: #5a9cf5;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
        }

        .invite-card {
            background: #fff;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        .invite-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .invite-state {
            flex: none;
            font-size: 11px;
            padding: 2px 9px;
            border-radius: 20px;
            font-weight: 600;
        }

        .invite-state.unused { background: #e8f3fe; color: #2b7fd4; }
        .invite-state.used { background: #e8f8ef; color: #27ae60; }
        .invite-state.expired { background: #f2f3f5; color: #9aa0a6; }

        /* ===== A8 暂停/恢复 按钮 ===== */
        .btn-status {
            flex: 1;
            padding: 8px;
            background: #fff;
            color: #f39c12;
            border: 1px solid #f39c12;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-status:hover { background: #fef3e2; }
        .btn-status.resume { color: #27ae60; border-color: #27ae60; }
        .btn-status.resume:hover { background: #e8f8ef; }

        /* ===== A2 复制全部码 ===== */
        .copy-all-btn {
            padding: 7px 14px;
            margin-bottom: 10px;
            border: 1px solid #cfe0fb;
            border-radius: 8px;
            background: #fff;
            color: #5a9cf5;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }

        .copy-all-btn:hover { background: #f2f7ff; }

        /* ===== A6 操作记录 ===== */
        .op-item {
            background: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            font-size: 13px;
        }

        .op-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .op-action { font-size: 13px; font-weight: 600; color: #333; }
        .op-target { font-size: 12px; font-weight: 500; color: #5a9cf5; margin-left: 8px; }
        .op-time { flex: none; font-size: 11px; color: #aaa; }

        .op-fields {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 14px;
            font-size: 11px;
            color: #9aa0a6;
            line-height: 1.7;
        }

        .op-ip {
            margin-left: auto;
            color: #c0c4cc;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            word-break: break-all;
        }

        .toast {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-72px);
            display: flex;
            align-items: center;
            max-width: calc(100% - 40px);
            padding: 10px 16px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,.12);
            color: #2c3138;
            font-size: 14px;
            font-weight: 500;
            z-index: 9999;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        .toast::before {
            content: '!';
            width: 18px; height: 18px;
            border-radius: 50%;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background: #f56c6c;
            margin-right: 8px;
        }

        .toast.success::before { content: '✓'; background: #2ecc71; }
        .toast.success, .toast.error { background: #fff; }

        .login-required {
            display: none;
            text-align: center;
            max-width: 414px;
            margin: 80px auto 0;
            background: #fff;
            border-radius: 16px;
            padding: 48px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            color: #888;
        }

        .login-required h2 {
            color: #e74c3c;
            margin-bottom: 12px;
            font-size: 20px;
        }

        #mainContent { display: none; }

        /* ===== 用户管理：搜索/筛选/新增/编辑/删除 ===== */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 150px;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .search-input:focus { border-color: #5a9cf5; }

        .filter-select {
            padding: 9px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            outline: none;
            font-family: inherit;
        }

        .btn-add-user {
            padding: 9px 16px;
            background: #5a9cf5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-add-user:hover { opacity: 0.9; }

        .role-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 500;
            margin-left: 6px;
            vertical-align: 1px;
        }

        .role-admin { background: #ede7f6; color: #7c4dff; }
        .role-user { background: #eef2f7; color: #7f8c9b; }
        .role-self { background: #e8f8ef; color: #27ae60; }

        .btn-manage {
            flex: 1;
            padding: 8px;
            background: #5a9cf5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-manage:hover { background: #4a8ce4; }

        .btn-delete {
            flex: 1;
            padding: 8px;
            background: #fff;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .btn-delete:hover { background: #fdeaea; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px;
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal h3 {
            font-size: 17px;
            color: #333;
            margin-bottom: 18px;
        }

        .modal .form-group { margin-bottom: 14px; }

        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
        }

        .modal input, .modal select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            color: #2c3138;
            outline: none;
            background: #fff;
            font-family: inherit;
            -webkit-appearance: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .modal input:focus, .modal select:focus {
            border-color: #5a9cf5;
            box-shadow: 0 0 0 3px rgba(90,156,245,.12);
            background: #fff;
        }

        .hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-cancel { background: #f0f2f5; color: #666; }
        .btn-primary { background: #5a9cf5; color: #fff; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== 移动端视觉优化（手机宽度） ===== */
        @media (max-width: 768px) {
            /* 顶部标题栏：白底 + 深灰字 + 1px 底部分隔线 */
            .header {
                background: #fff;
                color: #2c3138;
                padding: 10px 14px;
                padding-top: calc(10px + env(safe-area-inset-top));
                border-bottom: 1px solid #eef0f3;
                box-shadow: none;
            }
            .header h1 { font-size: 15px; font-weight: 600; color: #2c3138; }
            .header-right .admin-name { display: none; }
            .header-left .back-btn,
            .logout-btn { padding: 6px 10px; font-size: 12px; border-radius: 6px; background: #f5f7fa; color: #666; }

            /* 标签栏：字号收紧、细分隔线 */
            .tab { padding: 10px 6px; font-size: 13px; }
            .tabs { background: #fff; border-bottom: 1px solid #eef0f3; }

            /* 内容区留白 */
            .tab-content { padding: 12px 14px calc(20px + env(safe-area-inset-bottom)); }

            /* 统计卡：两列小卡、圆角 12、字号缩小 */
            .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
            .stat-card { padding: 12px 8px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
            .stat-number { font-size: 19px; }
            .stat-label { font-size: 11px; }

            /* 搜索/筛选/操作按钮：纵向堆叠、全宽 */
            .toolbar { flex-direction: column; align-items: stretch; gap: 8px; }
            .toolbar .search-input,
            .toolbar .filter-select,
            .toolbar .btn-add-user,
            .toolbar .export-btn,
            .toolbar .btn { width: 100%; min-width: 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
            .btn-add-user { background: #5a9cf5; }

            /* 记录卡：首行姓名 + 状态标签，下方小字日期/时间/理由 */
            .user-card { border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
            .user-card-header { margin-bottom: 6px; }
            .user-name { font-size: 15px; }
            .user-meta { flex-wrap: wrap; gap: 4px 12px; font-size: 11px; line-height: 1.5; }
            .status-badge { padding: 3px 9px; font-size: 11px; border-radius: 20px; }
            .log-item { border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; flex-wrap: wrap; gap: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
            .log-time { width: 100%; font-size: 11px; color: #aaa; }
            /* 导出等次级操作：全宽、圆角 8 */
            .section-header { flex-direction: column; align-items: stretch; gap: 8px; margin-bottom: 10px; }
            .section-header .export-btn { width: 100%; padding: 10px 12px; border-radius: 8px; text-align: center; }

            /* 按钮：加大触控高度 */
            .btn-approve, .btn-reject, .btn-manage, .btn-delete { padding: 10px; font-size: 13px; border-radius: 8px; }
            .note-input { height: 38px; border-radius: 8px; font-size: 13px; }
            .note-save-btn { padding: 0 14px; height: 38px; border-radius: 8px; }
            .empty-tip { padding: 48px 16px; font-size: 13px; }
            .actions-row { display: flex; gap: 8px; }
            .actions-row .search-input { flex: 1; }

            /* 弹窗：圆角 16、内边距 24px、按钮全宽 */
            .modal { border-radius: 16px; padding: 24px; }
            .modal h3 { font-size: 16px; margin-bottom: 14px; }
            .modal-actions { flex-direction: column; gap: 10px; margin-top: 16px; }
            .modal-actions button { width: 100%; padding: 12px; border-radius: 10px; }
        }

        /* 兜底：页面若存在自绘顶栏（.app-topbar），内容整体下移，避免被压住 */
        body:has(.app-topbar) {
            padding-top: calc(44px + env(safe-area-inset-top));
        }
    </style>
</head>
<body>
    <div id="loginRequired" class="login-required">
        <h2>⛔ 无权限</h2>
        <p>请先登录管理员账号</p>
        <p id="loginHint" style="margin-top:12px;color:#e74c3c;font-size:13px"></p>
        <p style="margin-top:12px"><a href="login.html" style="color:#5a9cf5">返回登录</a></p>
    </div>

    <div id="mainContent">
        <div class="header">
            <div class="header-left">
                <h1>📋 管理后台</h1>
            </div>
            <div class="header-right">
                <span class="admin-name" id="adminName"></span>
                <button class="logout-btn" onclick="location.href='home.html'">返回工作台</button>
                <button class="logout-btn" onclick="refreshData()">刷新</button>
                <button class="logout-btn" onclick="handleLogout()">退出</button>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="pending" onclick="switchTab('pending')">待审核 <span id="pendingCount">0</span></div>
            <div class="tab" data-tab="users" onclick="switchTab('users')">全部用户 <span id="approvedCount">0</span>/<span id="totalUsers">0</span></div>
            <div class="tab" data-tab="logs" onclick="switchTab('logs')">登录日志</div>
            <div class="tab" data-tab="invites" onclick="switchTab('invites')">邀请码</div>
            <div class="tab" data-tab="ops" onclick="switchTab('ops')">操作记录</div>
        </div>

        <div class="tab-content active" id="tab-pending">
            <div id="pendingList"></div>
        </div>

        <div class="tab-content" id="tab-users">
            <div class="toolbar">
                <input class="search-input" id="userSearch" placeholder="🔍 搜索用户名/设备码/状态/备注..." oninput="onSearchInput(this.value)">
                <select class="filter-select" id="statusFilter" onchange="onFilterChange(this.value)">
                    <option value="all">全部状态</option>
                    <option value="approved">已启用</option>
                    <option value="pending">待审核</option>
                    <option value="disabled">已暂停</option>
                    <option value="rejected">已驳回</option>
                </select>
                <select class="filter-select" id="bindFilter" onchange="onBindFilterChange(this.value)">
                    <option value="all">全部绑定</option>
                    <option value="apk">安卓 App</option>
                    <option value="totp">iOS 动态码</option>
                    <option value="off">管理员不限</option>
                    <option value="none">未绑定</option>
                </select>
                <select class="filter-select" id="sortBy" onchange="onSortChange(this.value)">
                    <option value="last">最近登录</option>
                    <option value="created">注册时间</option>
                </select>
                <button class="btn-add-user" onclick="openCreateUser()">＋ 新增用户</button>
            </div>
            <div id="userList"></div>
        </div>

        <div class="tab-content" id="tab-logs">
            <div class="section-header">
                <span class="section-title">最近登录记录</span>
                <button class="export-btn" onclick="exportLogs()">导出 CSV</button>
            </div>
            <div id="logList"></div>
        </div>

        <div class="tab-content" id="tab-invites">
            <div class="invite-toolbar">
                <input type="number" id="inviteCount" min="1" max="20" value="1" style="width:88px;">
                <input type="text" id="inviteNote" placeholder="备注（可空，如：给某某同学）" maxlength="40">
                <button id="genInviteBtn" onclick="genInvites()">生成邀请码</button>
            </div>
            <div id="inviteGenActions" style="display:none">
                <button class="copy-all-btn" onclick="copyAllInvites()">📋 复制全部码</button>
            </div>
            <div class="invite-gen-list" id="inviteGenList"></div>
            <div class="section-header">
                <span class="section-title">邀请码记录</span>
                <button class="export-btn" onclick="loadInvites()">刷新</button>
            </div>
            <div id="inviteList"></div>
        </div>

        <div class="tab-content" id="tab-ops">
            <div class="section-header">
                <span class="section-title">管理员操作记录</span>
                <button class="export-btn" onclick="loadOpsLogs()">刷新</button>
            </div>
            <div id="opList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
            <h3 id="modalTitle">编辑用户</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="mUsername" placeholder="请输入用户名" autocomplete="off">
            </div>
            <div class="form-group">
                <label id="mPasswordLabel">重置密码</label>
                <input type="text" id="mPassword" placeholder="留空则不修改密码" autocomplete="new-password">
                <div class="hint" id="mPasswordHint">至少 6 位；填写后该用户原密码将被重置</div>
            </div>
            <div class="form-group">
                <label>角色</label>
                <select id="mRole">
                    <option value="user">普通用户</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="mStatus">
                    <option value="approved">已启用</option>
                    <option value="pending">待审核</option>
                    <option value="disabled">已暂停</option>
                    <option value="rejected">已驳回</option>
                </select>
            </div>
            <div class="form-group" id="mInvitedByGroup">
                <label>邀请人</label>
                <input type="text" id="mInvitedBy" placeholder="选填，需为已注册用户的账户名" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-primary" id="mSaveBtn" onclick="submitModal()">保存</button>
            </div>
        </div>
    </div>

    <!-- 通用二次确认弹窗（沿用 modal 样式） -->
    <div class="modal-overlay" id="confirmOverlay" onclick="if(event.target===this) closeConfirm()">
        <div class="modal">
            <h3 id="confirmTitle">确认操作</h3>
            <div class="form-group">
                <div id="confirmMsg" style="font-size:13px;color:#606266;line-height:1.7;"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeConfirm()">取消</button>
                <button class="btn-primary" id="confirmOkBtn" onclick="runConfirm()">确定</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://hqoeptonghttbqggpcwx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ShrC-Qjx3-V_cfIcrYgqWw_HEp4pE_-';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let allUsers = [];
        let allLogs = [];
        let allOps = [];

        // 用户管理状态
        let userSearchKey = '';
        let statusFilterVal = 'all';
        let bindFilterVal = 'all';   // A3 绑定筛选
        let sortByVal = 'last';      // A4 排序方式：last=最近登录 / created=注册时间
        let editingUserId = null; // null = 新增模式
        let currentAdmin = null;

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(password));
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 管理凭证：登录时存入（管理员密码的 SHA-256），后台所有操作都靠它验证
        const ADMIN_TOKEN = localStorage.getItem('leave_token') || '';

        function asJson(d) {
            if (d && typeof d === 'object') return d;
            if (typeof d === 'string') { try { return JSON.parse(d); } catch (e) { return null; } }
            return null;
        }

        // 统一调用后台管理函数；凭证失效时自动退回登录页
        async function callAdminOp(action, target, data) {
            const { data: raw, error } = await supabase.rpc('admin_op', {
                p_token: ADMIN_TOKEN,
                p_action: action,
                p_target: target,
                p_data: data ?? null
            });
            const res = asJson(raw);
            if (error) {
                showToast('操作失败：' + (error.message || '未知错误'), 'error');
                return null;
            }
            if (!res || res.error) {
                showToast((res && res.error) || '操作失败', 'error');
                if (res && res.error === '管理员验证失败') setTimeout(handleLogout, 1200);
                return null;
            }
            return res;
        }

        function showToast(msg, type = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (type ? ' ' + type : '');
            setTimeout(() => t.className = 'toast', 2500);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function shortUA(ua) {
            if (!ua) return '—';
            if (ua.includes('Windows')) return 'Windows PC';
            if (ua.includes('Macintosh') || ua.includes('Mac OS')) return 'Mac';
            if (ua.includes('iPhone')) return 'iPhone';
            if (ua.includes('Android')) return 'Android';
            return '其他设备';
        }

        // ===== B1/B2 绑定与登录记录字段映射 =====
        const BIND_TYPE_TEXT = { apk: '安卓 App（设备码）', totp: 'iOS 动态码', off: '管理员不限' };

        function bindTypeText(type) {
            return BIND_TYPE_TEXT[type] || '未绑定';
        }

        function deviceLabel(key) {
            if (!key) return '—';
            if (key.indexOf('apk:') === 0) return '安卓 App';
            if (key.indexOf('ua:') === 0) return '网页（iOS/电脑）';
            return '—';
        }

        function deviceCodeOf(key) {
            if (key && key.indexOf('apk:') === 0) return key.slice(4) || '—';
            return '—';
        }

        const LOG_REASON_TEXT = {
            BAD_PASSWORD: '密码错误',
            NO_USER: '账号不存在',
            PENDING: '待审核',
            DISABLED: '已暂停',
            NEED_APK: '非App登录',
            DEVICE_MISMATCH: '设备不符',
            TOTP_FAIL: '动态码错误',
            TOTP_REPLAY: '验证码重复',
            NEED_BIND: '未绑定',
            BIND_TOTP_OK: '绑定成功',
            BIND_TOTP_FAIL: '绑定失败'
        };

        function logResultText(log) {
            if (log.ok === true) return '成功';
            const r = log.reason;
            if (!r) return '失败';
            return LOG_REASON_TEXT[r] || r;
        }

        // DISABLED 统一叫「已暂停」

        // ===== A8 状态中文映射（全站统一：待审核 / 已启用 / 已暂停 / 已驳回） =====
        const STATUS_TEXT = { pending: '待审核', approved: '已启用', disabled: '已暂停', rejected: '已驳回' };

        function statusText(status) {
            return STATUS_TEXT[status] || status || '—';
        }

        function statusClassOf(status) {
            if (status === 'approved') return 'status-approved';
            if (status === 'disabled') return 'status-disabled';
            if (status === 'rejected') return 'status-rejected';
            return 'status-pending';
        }

        // ===== A6 操作记录动作中文映射 =====
        const OP_ACTION_TEXT = {
            auto_disabled_inactive: '自动暂停',
            admin_set_status: '暂停/恢复账号',
            gen_invite: '生成邀请码',
            reset_bind: '重置绑定',
            create_user: '新增用户',
            edit_user: '修改用户',
            delete_user: '删除用户',
            approve_user: '审核通过'
        };

        function opActionText(action) {
            return OP_ACTION_TEXT[action] || action || '—';
        }

        // ===== A7 管理员动作落库（不影响主流程：不 await、失败静默） =====
        function logAdminOp(pAction, pTarget, pDetail) {
            try {
                supabase.rpc('admin_log_op', {
                    p_token: ADMIN_TOKEN,
                    p_actor: (currentAdmin && currentAdmin.username) || '',
                    p_action: pAction,
                    p_target: pTarget ?? null,
                    p_detail: pDetail ?? null
                }).then(() => { }).catch(() => { });
            } catch (e) { /* 记录失败不影响主流程 */ }
        }

        window.switchTab = function(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));
            if (name === 'invites') loadInvites();
            if (name === 'ops') loadOpsLogs();
        };

        function renderPending(users) {
            const list = users.filter(u => u.status === 'pending');
            document.getElementById('pendingCount').textContent = list.length;
            const el = document.getElementById('pendingList');
            if (list.length === 0) {
                el.innerHTML = '<div class="empty-tip">暂无待审核用户</div>';
                return;
            }
            el.innerHTML = list.map(u => `
                <div class="user-card">
                    <div class="user-card-header">
                        <span class="user-name">${u.username}</span>
                        <span class="status-badge status-pending">待审核</span>
                    </div>
                    <div class="invite-tag">邀请人：${u.invited_by || '无'}</div>
                    <div class="user-meta">
                        <span>注册时间：${formatDate(u.created_at)}</span>
                    </div>
                    <div class="user-actions">
                        <button class="btn-approve" onclick="approveUser('${u.id}')">通过</button>
                        <button class="btn-reject" onclick="rejectUser('${u.id}')">驳回</button>
                    </div>
                </div>
            `).join('');
        }

        function renderUsers(users) {
            const approved = users.filter(u => u.status === 'approved');
            const total = users.length;
            document.getElementById('approvedCount').textContent = approved.length;
            document.getElementById('totalUsers').textContent = total;

            const el = document.getElementById('userList');
            let sorted = [...users];
            // A4 排序：最近登录（空值自然排最后）/ 注册时间，都是倒序
            if (sortByVal === 'created') {
                sorted.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            } else {
                sorted.sort((a, b) => String(b.last_login || '').localeCompare(String(a.last_login || '')));
            }
            if (statusFilterVal !== 'all') sorted = sorted.filter(u => u.status === statusFilterVal);
            // A3 绑定筛选：无绑定行按 none 处理
            if (bindFilterVal !== 'all') {
                sorted = sorted.filter(u => (u.bind_type || 'none') === bindFilterVal);
            }
            // A3 搜索：用户名 / 设备码 / 绑定类型中文 / 状态中文 / 备注
            if (userSearchKey) {
                sorted = sorted.filter(u => {
                    const hay = [
                        u.username || '',
                        u.device_id || '',
                        bindTypeText(u.bind_type),
                        statusText(u.status),
                        u.note || ''
                    ].join(' ').toLowerCase();
                    return hay.includes(userSearchKey);
                });
            }
            if (sorted.length === 0) {
                el.innerHTML = `<div class="empty-tip">${total === 0 ? '暂无用户' : '没有符合条件的用户'}</div>`;
                return;
            }
            el.innerHTML = sorted.map(u => {
                const statusClass = statusClassOf(u.status);
                const statusLabel = statusText(u.status);
                const isSelf = currentAdmin && u.id === currentAdmin.id;
                const isDisabled = u.status === 'disabled';
                const roleBadge = u.role === 'admin'
                    ? '<span class="role-badge role-admin">管理员</span>'
                    : '<span class="role-badge role-user">用户</span>';
                const selfBadge = isSelf ? '<span class="role-badge role-self">我</span>' : '';
                return `
                    <div class="user-card">
                        <div class="user-card-header">
                            <span class="user-name">${escapeHtml(u.username)}${roleBadge}${selfBadge}</span>
                            <span class="status-badge ${statusClass}">${statusLabel}</span>
                        </div>
                        <div class="invite-tag">邀请人：${escapeHtml(u.invited_by || '无')}</div>
                        <div class="user-meta">
                            <span>登录次数：${u.login_count || 0}</span>
                            <span>最近登录：${formatDate(u.last_login)}</span>
                        </div>
                        <div class="bind-line">
                            <span>绑定设备：${escapeHtml(bindTypeText(u.bind_type))}</span>
                            <span>安卓设备码：${u.bind_type === 'apk' && u.device_id ? '<span class="device-code">' + escapeHtml(u.device_id) + '</span>' : '—'}</span>
                        </div>
                        <div class="note-section">
                            <label>备注</label>
                            <div class="note-input-row">
                                <input class="note-input" id="note-${u.id}" value="${escapeHtml(u.note || '')}" placeholder="添加备注...">
                                <button class="note-save-btn" onclick="saveNote('${u.id}')">保存</button>
                            </div>
                        </div>
                        <div class="user-actions">
                            <button class="btn-manage" onclick="openEditUser('${u.id}')">✏️ 编辑</button>
                            <button class="btn-manage" onclick="resetBind('${u.id}')">重置绑定</button>
                            <button class="btn-status${isDisabled ? ' resume' : ''}" onclick="setUserStatus('${u.id}')">${isDisabled ? '恢复' : '暂停'}</button>
                            <button class="btn-delete" onclick="deleteUser('${u.id}')">删除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLogs(logs) {
            const el = document.getElementById('logList');
            if (logs.length === 0) {
                el.innerHTML = '<div class="empty-tip">暂无登录记录</div>';
                return;
            }
            el.innerHTML = logs.slice(0, 100).map(l => {
                const dev = deviceLabel(l.device_key);
                const devCode = deviceCodeOf(l.device_key);
                const result = logResultText(l);
                return `
                <div class="log-item">
                    <div class="log-line-top">
                        <span class="log-user">${escapeHtml(l.username || '(未知)')}</span>
                        <span class="log-result ${l.ok === true ? 'ok' : 'fail'}">${escapeHtml(result)}</span>
                    </div>
                    <div class="log-fields">
                        <span>登录时间：${escapeHtml(formatDate(l.login_time))}</span>
                        <span>设备：${escapeHtml(dev)}</span>
                        <span>安卓设备码：${devCode === '—' ? '—' : '<span class="device-code">' + escapeHtml(devCode) + '</span>'}</span>
                        <span>IP：${escapeHtml(l.ip || '—')}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function loadUsers() {
            const { data } = await supabase.rpc('admin_list_users', { p_token: ADMIN_TOKEN });
            const res = asJson(data);
            if (res && res.error) {
                showToast(res.error, 'error');
                if (res.error === '管理员验证失败') setTimeout(handleLogout, 1200);
                return;
            }
            if (res && res.ok) {
                allUsers = res.data || [];
                renderPending(allUsers);
                renderUsers(allUsers);
            }
        }

        async function loadLogs() {
            const { data } = await supabase.rpc('admin_list_logs', { p_token: ADMIN_TOKEN });
            const res = asJson(data);
            if (res && res.ok) {
                allLogs = res.data || [];
                renderLogs(allLogs);
            }
        }

        window.refreshData = function() {
            loadUsers();
            loadLogs();
            showToast('已刷新', 'success');
        };

        // ===== B1 重置绑定（二次确认弹窗，沿用 modal 样式） =====
        let pendingResetUser = null;
        let confirmAction = null;

        window.resetBind = function(uid) {
            const u = allUsers.find(x => x.id === uid);
            if (!u) return;
            pendingResetUser = u;
            document.getElementById('confirmTitle').textContent = '重置绑定';
            document.getElementById('confirmMsg').textContent =
                '确定要重置用户「' + u.username + '」的设备绑定吗？重置后该用户下次登录需重新绑定。';
            confirmAction = doResetBind;
            document.getElementById('confirmOverlay').classList.add('show');
        };

        window.closeConfirm = function() {
            document.getElementById('confirmOverlay').classList.remove('show');
            pendingResetUser = null;
            confirmAction = null;
        };

        window.runConfirm = async function() {
            const fn = confirmAction;
            const btn = document.getElementById('confirmOkBtn');
            if (!fn) { closeConfirm(); return; }
            btn.disabled = true;
            try {
                await fn();
            } finally {
                btn.disabled = false;
                closeConfirm();
            }
        };

        async function doResetBind() {
            const u = pendingResetUser;
            if (!u) return;
            try {
                const { data, error } = await supabase.rpc('admin_bind_reset', {
                    p_token: ADMIN_TOKEN,
                    p_username: u.username
                });
                const res = asJson(data);
                if (error) { showToast('重置失败：' + error.message, 'error'); return; }
                if (res && res.error) { showToast(res.error, 'error'); return; }
                if (res && res.ok) {
                    showToast('已重置，该用户下次登录需重新绑定', 'success');
                    logAdminOp('reset_bind', u.username, '重置设备绑定');
                    await loadUsers();
                } else {
                    showToast('重置失败', 'error');
                }
            } catch (e) {
                showToast('重置失败：' + e.message, 'error');
            }
        }

        // ===== A8 暂停 / 恢复账号 =====
        let pendingStatusUser = null;
        let pendingStatusValue = 'disabled';

        window.setUserStatus = function(uid) {
            const u = allUsers.find(x => x.id === uid);
            if (!u) return;
            if (currentAdmin && uid === currentAdmin.id) {
                showToast('不能暂停自己的账号', 'error');
                return;
            }
            const toDisabled = u.status !== 'disabled';
            pendingStatusUser = u;
            pendingStatusValue = toDisabled ? 'disabled' : 'approved';
            document.getElementById('confirmTitle').textContent = toDisabled ? '暂停账号' : '恢复账号';
            document.getElementById('confirmMsg').textContent = toDisabled
                ? '确认暂停 ' + u.username + ' ？暂停后该账号无法登录，可随时恢复。'
                : '确认恢复 ' + u.username + ' ？恢复后该账号可以正常登录。';
            confirmAction = doSetStatus;
            document.getElementById('confirmOverlay').classList.add('show');
        };

        async function doSetStatus() {
            const u = pendingStatusUser;
            if (!u) return;
            const target = pendingStatusValue;
            try {
                const { data, error } = await supabase.rpc('admin_set_status', {
                    p_token: ADMIN_TOKEN,
                    p_username: u.username,
                    p_status: target,
                    p_actor: (currentAdmin && currentAdmin.username) || ''
                });
                const res = asJson(data);
                if (error) { showToast('操作失败：' + error.message, 'error'); return; }
                if (res && res.error) { showToast(res.error, 'error'); return; }
                if (res && res.ok) {
                    showToast(target === 'disabled' ? '已暂停' : '已恢复', 'success');
                    logAdminOp('admin_set_status', u.username, target);
                    await loadUsers();
                } else {
                    showToast('操作失败', 'error');
                }
            } catch (e) {
                showToast('操作失败：' + e.message, 'error');
            }
        }

        // ===== B2 登录记录已经用 deviceLabel / deviceCodeOf / logResultText 渲染 =====

        // ===== B3 邀请码 =====
        const INVITE_STATE_TEXT = { unused: '未使用', used: '已使用', expired: '已过期' };

        window.genInvites = async function() {
            const btn = document.getElementById('genInviteBtn');
            let count = parseInt(document.getElementById('inviteCount').value, 10) || 1;
            if (count > 20) count = 20;   // A1 夹紧到 1~20
            if (count < 1) count = 1;
            const note = document.getElementById('inviteNote').value.trim();
            btn.disabled = true;
            btn.textContent = '生成中...';
            try {
                const { data, error } = await supabase.rpc('admin_gen_invite', {
                    p_token: ADMIN_TOKEN,
                    p_count: count,
                    p_note: note
                });
                const res = asJson(data);
                if (error) { showToast('生成失败：' + error.message, 'error'); return; }
                if (res && res.error) { showToast(res.error, 'error'); return; }
                if (res && res.ok) {
                    renderGeneratedInvites(res.codes || []);
                    showToast('已生成 ' + (res.codes || []).length + ' 个邀请码', 'success');
                    logAdminOp('gen_invite', null, '生成 ' + (res.codes || []).length + ' 个');
                    await loadInvites();
                } else {
                    showToast('生成失败', 'error');
                }
            } catch (e) {
                showToast('生成失败：' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '生成邀请码';
            }
        };

        // A2 本次生成的码，供「复制全部码」使用
        let lastGenCodes = [];

        function renderGeneratedInvites(codes) {
            const el = document.getElementById('inviteGenList');
            lastGenCodes = codes || [];
            const actions = document.getElementById('inviteGenActions');
            if (actions) actions.style.display = lastGenCodes.length ? 'block' : 'none';
            if (!codes.length) { el.innerHTML = ''; return; }
            el.innerHTML = codes.map(code => `
                <div class="invite-gen-item">
                    <span class="invite-code">${escapeHtml(code)}</span>
                    <button class="invite-copy-btn" onclick="copyInviteCode('${escapeHtml(code)}')">复制</button>
                </div>
            `).join('');
        }

        // A2 一键复制本次生成的全部邀请码
        window.copyAllInvites = function() {
            const codes = lastGenCodes || [];
            if (!codes.length) { showToast('没有可复制的邀请码', 'error'); return; }
            const all = codes.join('\n');
            const okToast = () => showToast('已复制 ' + codes.length + ' 个邀请码', 'success');
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = all;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { }
                document.body.removeChild(ta);
                if (ok) okToast();
                else showToast('复制失败，请手动复制', 'error');
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(all).then(okToast).catch(() => fallback());
            } else {
                fallback();
            }
        };

        window.copyInviteCode = function(code) {
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = code;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { }
                document.body.removeChild(ta);
                showToast(ok ? '已复制邀请码' : '复制失败，请手动复制', ok ? 'success' : 'error');
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code)
                    .then(() => showToast('已复制邀请码', 'success'))
                    .catch(() => fallback());
            } else {
                fallback();
            }
        };

        async function loadInvites() {
            const el = document.getElementById('inviteList');
            try {
                const { data, error } = await supabase.rpc('admin_list_invites', { p_token: ADMIN_TOKEN });
                const res = asJson(data);
                if (error) { showToast('加载邀请码失败：' + error.message, 'error'); return; }
                if (res && res.error) { showToast(res.error, 'error'); return; }
                if (!res || !res.ok) { showToast('加载邀请码失败', 'error'); return; }
                renderInvites(res.data || []);
            } catch (e) {
                showToast('加载邀请码失败：' + e.message, 'error');
            }
        }

        function renderInvites(list) {
            const el = document.getElementById('inviteList');
            if (!list.length) {
                el.innerHTML = '<div class="empty-tip">暂无邀请码</div>';
                return;
            }
            el.innerHTML = list.map(item => `
                <div class="invite-card">
                    <div class="invite-card-top">
                        <span class="invite-code">${escapeHtml(item.code || '')}</span>
                        <span class="invite-state ${escapeHtml(item.state || 'unused')}">${INVITE_STATE_TEXT[item.state] || (item.state || '未知')}</span>
                    </div>
                    <div class="log-fields">
                        <span>创建时间：${escapeHtml(formatDate(item.created_at))}</span>
                        <span>过期时间：${escapeHtml(formatDate(item.expires_at))}</span>
                        <span>使用者：${escapeHtml(item.used_by || '—')}</span>
                        ${item.note ? '<span>备注：' + escapeHtml(item.note) + '</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        // ===== A6 操作记录页签 =====
        async function loadOpsLogs() {
            const el = document.getElementById('opList');
            el.innerHTML = '<div class="empty-tip">加载中...</div>';
            try {
                const { data, error } = await supabase.rpc('admin_logs_list', {
                    p_token: ADMIN_TOKEN,
                    p_limit: 300
                });
                const res = asJson(data);
                if (error) { showToast('加载操作记录失败：' + error.message, 'error'); return; }
                if (res && res.error) { showToast(res.error, 'error'); return; }
                if (!res || !res.ok) { showToast('加载操作记录失败', 'error'); return; }
                allOps = res.data || [];
                renderOpsLogs(allOps);
            } catch (e) {
                showToast('加载操作记录失败：' + e.message, 'error');
            }
        }

        function renderOpsLogs(list) {
            const el = document.getElementById('opList');
            if (!list.length) {
                el.innerHTML = '<div class="empty-tip">暂无操作记录</div>';
                return;
            }
            el.innerHTML = list.map(op => {
                const time = op.created_at ? new Date(op.created_at).toLocaleString('zh-CN') : '—';
                return `
                    <div class="op-item">
                        <div class="op-top">
                            <span>
                                <span class="op-action">${escapeHtml(opActionText(op.action))}</span>
                                ${op.target ? '<span class="op-target">' + escapeHtml(op.target) + '</span>' : ''}
                            </span>
                            <span class="op-time">${escapeHtml(time)}</span>
                        </div>
                        <div class="op-fields">
                            ${op.detail ? '<span>详情：' + escapeHtml(op.detail) + '</span>' : ''}
                            <span>操作人：${escapeHtml(op.actor || '—')}</span>
                            <span class="op-ip">${escapeHtml(op.ip || '—')}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.approveUser = async function(uid) {
            const u = allUsers.find(x => x.id === uid);
            const res = await callAdminOp('update', uid, { status: 'approved' });
            if (res) {
                showToast('已启用', 'success');
                logAdminOp('approve_user', u ? u.username : null, '审核通过');
                await loadUsers();
            }
        };

        window.rejectUser = async function(uid) {
            const res = await callAdminOp('update', uid, { status: 'rejected' });
            if (res) {
                showToast('已驳回', 'success');
                await loadUsers();
            }
        };

        window.saveNote = async function(uid) {
            const note = document.getElementById('note-' + uid).value.trim();
            const res = await callAdminOp('update', uid, { note });
            if (res) showToast('备注已保存', 'success');
        };

        // ===== 用户管理：搜索 / 筛选 / 新增 / 编辑 / 删除 =====
        window.onSearchInput = function(v) {
            userSearchKey = v.trim().toLowerCase();
            renderUsers(allUsers);
        };

        window.onFilterChange = function(v) {
            statusFilterVal = v;
            renderUsers(allUsers);
        };

        // A3 绑定筛选
        window.onBindFilterChange = function(v) {
            bindFilterVal = v;
            renderUsers(allUsers);
        };

        // A4 排序方式
        window.onSortChange = function(v) {
            sortByVal = v;
            renderUsers(allUsers);
        };

        function openModal(title, mode, u) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('mUsername').value = u ? u.username : '';
            document.getElementById('mPassword').value = '';
            document.getElementById('mRole').value = u ? (u.role || 'user') : 'user';
            document.getElementById('mStatus').value = u ? (u.status || 'approved') : 'approved';
            document.getElementById('mInvitedBy').value = '';
            document.getElementById('mInvitedByGroup').style.display = mode === 'create' ? 'block' : 'none';
            document.getElementById('mPasswordLabel').textContent = mode === 'create' ? '密码' : '重置密码';
            document.getElementById('mPassword').placeholder = mode === 'create' ? '请输入密码（至少6位）' : '留空则不修改密码';
            document.getElementById('mPasswordHint').textContent = mode === 'create' ? '至少 6 位' : '至少 6 位；填写后该用户原密码将被重置';
            editingUserId = u ? u.id : null;
            document.getElementById('modalOverlay').classList.add('show');
        }

        window.openEditUser = function(uid) {
            const u = allUsers.find(x => x.id === uid);
            if (u) openModal('编辑用户', 'edit', u);
        };

        window.openCreateUser = function() {
            openModal('新增用户', 'create', null);
        };

        window.closeModal = function() {
            document.getElementById('modalOverlay').classList.remove('show');
            editingUserId = null;
        };

        window.submitModal = async function() {
            const username = document.getElementById('mUsername').value.trim();
            const password = document.getElementById('mPassword').value;
            const role = document.getElementById('mRole').value;
            const status = document.getElementById('mStatus').value;
            const saveBtn = document.getElementById('mSaveBtn');
            const isCreate = !editingUserId;

            if (!username) { showToast('用户名不能为空', 'error'); return; }
            if (isCreate && !password) { showToast('请设置密码', 'error'); return; }
            if (password && password.length < 6) { showToast('密码至少 6 位', 'error'); return; }

            // 防止把自己锁在门外（自己的状态只允许改为已通过）
            if (!isCreate && currentAdmin && editingUserId === currentAdmin.id) {
                if (role !== 'admin') { showToast('不能修改自己的管理员角色', 'error'); return; }
                if (status !== 'approved') { showToast('自己的状态只能设为已启用', 'error'); return; }
            }

            saveBtn.disabled = true;
            try {
                let res;
                if (isCreate) {
                    // 用户名查重、邀请人校验都在数据库函数内完成
                    res = await callAdminOp('create', null, {
                        username,
                        password_hash: await hashPassword(password),
                        role,
                        status,
                        invited_by: document.getElementById('mInvitedBy').value.trim()
                    });
                } else {
                    const payload = { username, role, status };
                    if (password) payload.password_hash = await hashPassword(password);
                    res = await callAdminOp('update', editingUserId, payload);
                }

                if (res) {
                    showToast(isCreate ? '用户已创建' : '已保存', 'success');
                    logAdminOp(isCreate ? 'create_user' : 'edit_user', username, isCreate ? '新增用户' : '修改用户');
                    closeModal();
                    await loadUsers();
                }
            } catch (e) {
                showToast('操作失败：' + e.message, 'error');
            } finally {
                saveBtn.disabled = false;
            }
        };

        window.deleteUser = async function(uid) {
            const u = allUsers.find(x => x.id === uid);
            if (!u) return;
            if (currentAdmin && uid === currentAdmin.id) {
                showToast('不能删除自己的账号', 'error');
                return;
            }
            if (!confirm(`确定删除用户「${u.username}」吗？\n该操作不可恢复，将同时删除其登录日志。`)) return;
            const res = await callAdminOp('delete', uid, null);
            if (res) {
                showToast('已删除', 'success');
                logAdminOp('delete_user', u.username, '删除用户');
                await loadUsers();
            }
        };

                window.handleLogout = function() {
            localStorage.removeItem('leave_user');
            localStorage.removeItem('leaveConfig'); // 登出重置业务数据，回到演示模板
            window.location.href = 'login.html';
        };

        window.exportLogs = function() {
            if (allLogs.length === 0) {
                showToast('暂无数据可导出', 'error');
                return;
            }
            let csv = '\uFEFF账号,登录时间,设备\n';
            allLogs.forEach(l => {
                const time = l.login_time ? new Date(l.login_time).toLocaleString('zh-CN') : '—';
                const device = shortUA(l.user_agent);
                csv += `${l.username},${time},${device}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `登录记录_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('导出成功', 'success');
        };

        // ===== A5 页签吸顶：top 取顶部固定栏 .header 的实测高度（含 env 安全区） =====
        function syncTabsTop() {
            const hd = document.querySelector('.header');
            if (!hd) return;
            const h = hd.offsetHeight || 0;
            document.documentElement.style.setProperty('--tabs-top', h + 'px');
        }
        // mainContent 未登录时是 display:none，header 高度会先测到 0，所以用 ResizeObserver 跟着变
        if (window.ResizeObserver) {
            const hd = document.querySelector('.header');
            if (hd) new ResizeObserver(syncTabsTop).observe(hd);
        }
        window.addEventListener('load', syncTabsTop);
        window.addEventListener('resize', syncTabsTop);
        window.addEventListener('orientationchange', function() { setTimeout(syncTabsTop, 120); });

                // 初始化 — localStorage 鉴权
        const adminUser = JSON.parse(localStorage.getItem('leave_user') || 'null');
        if (!adminUser) {
            document.getElementById('loginRequired').style.display = 'block';
        } else if (adminUser.role !== 'admin') {
            document.getElementById('loginRequired').style.display = 'block';
        } else if (!ADMIN_TOKEN) {
            // 旧版登录没有管理凭证，需要重新登录一次
            document.getElementById('loginRequired').style.display = 'block';
            document.getElementById('loginHint').textContent = '管理凭证缺失，请退出后重新登录一次';
        } else {
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('adminName').textContent = adminUser.username;
            currentAdmin = adminUser;

            await loadUsers();
            await loadLogs();

            // 每 60 秒自动刷新用户列表和日志
            setInterval(() => {
                loadUsers();
                loadLogs();
            }, 60000);
        }
    </script>
</body>
</html>
