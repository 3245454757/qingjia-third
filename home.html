<!DOCTYPE html>
<!--home.html-->
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>工作台</title>
  <style>
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
      color: #333;
      padding-bottom: calc(clamp(50px, 13.5vw, 58px) + 12px); /* 防止内容被底部工具栏遮挡 */
    }

    .page {
      max-width: 414px;
      margin: 0 auto;
    }

    /* 顶部 Banner 卡片（贴边显示，最大化宽度） */
    .banner-card {
      background-color: #fff;
      margin: 0 0 clamp(8px, 2.6vw, 16px);
      padding: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .banner-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0;
    }

    /* 通用卡片 */
    .section {
      background-color: #fff;
      border-radius: 16px;
      margin: 0 clamp(8px, 2.6vw, 16px) clamp(8px, 2.6vw, 16px);
      padding: clamp(14px, 4.1vw, 19px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: clamp(12px, 3.4vw, 14px);
      color: #666;
      margin-bottom: clamp(10px, 3vw, 16px);
    }

    /* 应用网格 */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: clamp(12px, 3.6vw, 19px);
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .app-icon img {
      display: block;
      width: clamp(43px, 12.6vw, 55px);
      height: clamp(43px, 12.6vw, 55px);
      object-fit: contain;
    }

    /* 手机版图标内缩：邻居实测内容占比 R=0.833（140/168），每边内缩 8.33% 框宽；
       box-sizing:border-box 使外框尺寸不变，仅视觉缩小，不影响布局与文字 */
    .icon-inset {
      box-sizing: border-box;
      padding: calc(0.0833 * clamp(43px, 12.6vw, 55px));
    }

    .app-name {
      font-size: clamp(11px, 3vw, 13px);
      color: #333;
      line-height: 1.2;
      margin-top: 6px;
      white-space: nowrap;
    }

    .app-tag {
      font-size: 10px;
      color: #909cab;
      margin-top: 2px;
      line-height: 1;
    }

    /* 底部工具栏 */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 414px;
      margin: 0 auto;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: clamp(50px, 13.5vw, 58px);
      background-color: #fff;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
      padding: 0 8px;
      box-sizing: border-box;
    }

    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #888;
      text-decoration: none;
    }

    .footer-item.active {
      color: #5a9cf5;
    }

    .footer-icon img {
      display: block;
      width: clamp(22px, 6vw, 26px);
      height: clamp(22px, 6vw, 26px);
      object-fit: contain;
      margin-bottom: 3px;
    }

    /* 「我」tab 图标单独缩小一号：每边内缩 5% 框宽，外框不变不影响布局 */
    .footer-icon-sm {
      box-sizing: border-box;
      padding: calc(0.05 * clamp(22px, 6vw, 26px));
    }

    /* 加载遮罩（风格照抄 waiting.html：load.gif + 「加载中...」14px #666 居中） */
    #loading-mask {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: opacity 0.4s ease;
    }

    #loading-mask img {
      display: block;
      max-width: 60%;
      max-height: 60%;
    }

    #loading-mask p {
      font-size: 14px;
      color: #666;
      margin: 0;
      line-height: 1;
    }

    #loading-mask.hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
<!-- 自绘顶部导航栏（APK/独立浏览器用；企业微信内会与原生导航栏重复） -->
  <style>
    .app-topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: calc(44px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border-bottom: 1px solid #eee;
    }
    .app-topbar .topbar-back {
      position: absolute; left: 0; top: env(safe-area-inset-top);
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      color: #333; text-decoration: none;
    }
    .app-topbar .topbar-back svg { width: 22px; height: 22px; display: block; }
    .app-topbar .topbar-title { font-size: 16px; font-weight: 500; color: #333; line-height: 1; }
    body { padding-top: calc(44px + env(safe-area-inset-top)); }
  </style>
<!-- 通用确认弹窗（替代原生 confirm，白色圆角卡片 + 半透明遮罩，企微风） -->
  <style>
    .cf-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 10001;
      display: none;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .cf-mask.show { display: flex; }
    .cf-card {
      background: #fff;
      border-radius: 14px;
      width: 100%; max-width: 300px;
      padding: 24px 20px 16px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      animation: cfIn .2s ease;
    }
    @keyframes cfIn {
      from { opacity: 0; transform: scale(.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .cf-title { font-size: 17px; font-weight: 600; color: #333; margin: 0 0 8px; }
    .cf-desc { font-size: 14px; color: #666; line-height: 1.6; margin: 0 0 20px; }
    .cf-btns { display: flex; gap: 10px; }
    .cf-btn {
      flex: 1; padding: 10px 0;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 500;
      font-family: inherit; cursor: pointer;
      transition: opacity .15s;
    }
    .cf-btn:active { opacity: .8; }
    .cf-btn.cancel { background: #f0f2f5; color: #666; }
    .cf-btn.ok { background: #5a9cf5; color: #fff; }
    .cf-btn.ok.danger { background: #e74c3c; }
  </style>
</head>
<body>
  <header class="app-topbar">
    <div class="topbar-title">工作台</div>
  </header>
  <script>if(/wxwork/i.test(navigator.userAgent)){document.body.style.paddingTop='0';var tb=document.querySelector('.app-topbar');if(tb)tb.style.display='none';}</script>
  <div id="loading-mask">
    <img src="load.gif" alt="加载中">
    <p id="loading-text">加载中...</p>
  </div>
  <div class="page">
    <!-- a. Banner -->
    <div class="banner-card">
      <img src="d_ad.png" alt="" />
    </div>

    <!-- b. 效率工具 -->
    <div class="section">
      <div class="section-title">效率工具</div>
      <div class="app-grid">
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-richeng.png" alt="" /></div>
          <div class="app-name">日程</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-huiyi.png" alt="" /></div>
          <div class="app-name">会议</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-weipan.png" alt="" /></div>
          <div class="app-name">微盘</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-wendang-grid.png" alt="" /></div>
          <div class="app-name">收集表</div>
        </div>
      </div>
    </div>

    <!-- d. 警院微应用 -->
    <div class="section">
      <div class="section-title">警院微应用</div>
      <div class="app-grid">
        <a href="waiting.html?target=workshop.html" class="app-item">
          <div class="app-icon"><img src="icons/icon-zhangshangxiaoyuan.png" alt="" /></div>
          <div class="app-name">掌上校园</div>
        </a>
      </div>
    </div>

    <!-- c. 智能办公AI+ -->
    <div class="section">
      <div class="section-title">智能办公AI+</div>
      <div class="app-grid">
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-zhinengwendang.png" alt="" /></div>
          <div class="app-name">智能文档</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-zhinengbiaoge.png" alt="" /></div>
          <div class="app-name">智能表格</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-zhinengzongjie.png" alt="" /></div>
          <div class="app-name">智能总结</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-zhinengjiqiren.png" alt="" /></div>
          <div class="app-name">智能机器人</div>
          <div class="app-tag">AI+</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-jilumianliao.png" alt="" /></div>
          <div class="app-name">记录面聊</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-fuwuzongjie.png" alt="" /></div>
          <div class="app-name">服务总结</div>
        </div>
      </div>
    </div>

    <!-- 无标题栏：企业小助手 / 手机版 -->
    <div class="section">
      <div class="app-grid">
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-qiyezhanghao.png" alt="" /></div>
          <div class="app-name">企业小助手</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-shoujiban.png" alt="" class="icon-inset" /></div>
          <div class="app-name">手机版</div>
        </div>
      </div>
    </div>
  </div>

  <!-- e. 底部工具栏 -->
  <div class="footer">
    <a href="#" id="tab-msg" class="footer-item">
      <div class="footer-icon"><img src="icons/icon-tab-xiaoxi.png" alt="" /></div>
      <span>消息</span>
    </a>
    <a href="#" class="footer-item">
      <div class="footer-icon"><img src="icons/icon-tab-wendang.png" alt="" /></div>
      <span>文档</span>
    </a>
    <a href="#" class="footer-item">
      <div class="footer-icon"><img src="icons/icon-tab-tongxunlu.png" alt="" /></div>
      <span>通讯录</span>
    </a>
    <a href="#" class="footer-item active">
      <div class="footer-icon"><img src="icons/icon-tab-gongzuotai.png" alt="" /></div>
      <span>工作台</span>
    </a>
    <a href="#" id="tab-me" class="footer-item">
      <div class="footer-icon"><img src="icons/icon-tab-wo.png" alt="" class="footer-icon-sm" /></div>
      <span>我</span>
    </a>
  </div>

  <!-- 确认弹窗结构 -->
  <div class="cf-mask" id="cfMask">
    <div class="cf-card">
      <h3 class="cf-title" id="cfTitle"></h3>
      <p class="cf-desc" id="cfDesc"></p>
      <div class="cf-btns">
        <button type="button" class="cf-btn cancel" id="cfCancel">取消</button>
        <button type="button" class="cf-btn ok" id="cfOk">确定</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var mask = document.getElementById('loading-mask');
      var imgs = Array.prototype.slice.call(document.images);
      var loads = imgs.map(function (img) {
        if (img.complete) return Promise.resolve();
        return new Promise(function (res) {
          img.addEventListener('load', res, { once: true });
          img.addEventListener('error', res, { once: true }); /* 失败也计入完成 */
        });
      });
      var timeout = new Promise(function (res) { setTimeout(res, 3000); }); /* 最长 3 秒强制放行 */
      var hidden = false;
      function hide() {
        if (hidden) return;
        hidden = true;
        mask.classList.add('hide');
        setTimeout(function () { if (mask.parentNode) mask.parentNode.removeChild(mask); }, 450);
      }
      Promise.race([Promise.all(loads), timeout]).then(hide);
      setTimeout(hide, 3500); /* 兜底：确保遮罩必然消失 */
    })();
  </script>
  <script>
    /* 自绘确认弹窗：showConfirm(message, options, onOk) */
    function showConfirm(msg, opts, onOk) {
      var mask = document.getElementById('cfMask');
      document.getElementById('cfTitle').textContent = msg;
      document.getElementById('cfDesc').textContent = (opts && opts.desc) || '';
      var okBtn = document.getElementById('cfOk');
      okBtn.textContent = (opts && opts.okText) || '确定';
      okBtn.classList.toggle('danger', !!(opts && opts.danger));
      mask.classList.add('show');
      okBtn.onclick = function () {
        mask.classList.remove('show');
        if (onOk) onOk();
      };
      document.getElementById('cfCancel').onclick = function () {
        mask.classList.remove('show');
      };
      mask.onclick = function (e) { if (e.target === mask) mask.classList.remove('show'); };
    }
  </script>
  <script>
    /* 底部 Tab 行为：消息=退出确认；我=管理员判断（判定规则与 admin.html 一致：leave_user.role === 'admin'） */
    (function () {
      function toast(msg) {
        var t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);' +
          'background:rgba(0,0,0,.75);color:#fff;font-size:13px;line-height:1;padding:10px 16px;' +
          'border-radius:8px;z-index:10000;white-space:nowrap;transition:opacity .3s';
        document.body.appendChild(t);
        setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { if (t.parentNode) t.remove(); }, 320); }, 1600);
      }
      function logout() {
        localStorage.removeItem('leave_user');
        localStorage.removeItem('leave_token');
        localStorage.removeItem('leaveConfig');
        window.location.href = 'login.html';
      }
      var msgTab = document.getElementById('tab-msg');
      if (msgTab) msgTab.addEventListener('click', function (e) {
        e.preventDefault();
        showConfirm('退出登录', { desc: '退出后需要重新登录才能继续使用', okText: '退出', danger: true }, function () { logout(); });
      });
      var meTab = document.getElementById('tab-me');
      if (meTab) meTab.addEventListener('click', function (e) {
        e.preventDefault();
        var u = null;
        try { u = JSON.parse(localStorage.getItem('leave_user') || 'null'); } catch (err) { u = null; }
        if (!u) { toast('请先登录'); return; }
        if (u.role === 'admin') {
          showConfirm('进入后台管理', { desc: '将跳转到后台管理页面，仅管理员可操作', okText: '进入' }, function () {
            window.location.href = 'admin.html';
          });
        } else {
          toast('当前账号无后台管理权限');
        }
      });
    })();
  </script>
</body>
</html>
