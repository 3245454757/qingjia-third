<!DOCTYPE html>
<!--home.html-->
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工作台</title>
  <style>
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f7fa;
      color: #333;
      padding-bottom: calc(clamp(50px, 13.5vw, 58px) + 12px); /* 防止内容被底部工具栏遮挡 */
    }

    .page {
      max-width: 414px;
      margin: 0 auto;
    }

    /* 顶部 Banner 卡片 */
    .banner-card {
      background-color: #fff;
      border-radius: 16px;
      margin: clamp(8px, 2.6vw, 16px) clamp(8px, 2.6vw, 16px) clamp(8px, 2.6vw, 16px);
      padding: clamp(12px, 3.4vw, 16px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .banner-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    /* 通用卡片 */
    .section {
      background-color: #fff;
      border-radius: 16px;
      margin: 0 clamp(8px, 2.6vw, 16px) clamp(8px, 2.6vw, 16px);
      padding: clamp(12px, 3.4vw, 16px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: clamp(12px, 3.4vw, 14px);
      color: #666;
      margin-bottom: clamp(10px, 3vw, 16px);
    }

    /* 应用网格 */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: clamp(10px, 3vw, 16px);
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .app-icon img {
      display: block;
      width: clamp(36px, 10.5vw, 46px);
      height: clamp(36px, 10.5vw, 46px);
      object-fit: contain;
    }

    /* 手机版图标内缩：邻居实测内容占比 R=0.833（140/168），每边内缩 8.33% 框宽；
       box-sizing:border-box 使外框尺寸不变，仅视觉缩小，不影响布局与文字 */
    .icon-inset {
      box-sizing: border-box;
      padding: calc(0.0833 * clamp(36px, 10.5vw, 46px));
    }

    .app-name {
      font-size: clamp(11px, 3vw, 13px);
      color: #333;
      line-height: 1.2;
      margin-top: 6px;
      white-space: nowrap;
    }

    .app-tag {
      font-size: 10px;
      color: #909cab;
      margin-top: 2px;
      line-height: 1;
    }

    /* 底部工具栏 */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 414px;
      margin: 0 auto;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: clamp(50px, 13.5vw, 58px);
      background-color: #fff;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
      padding: 0 8px;
      box-sizing: border-box;
    }

    .footer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #888;
      text-decoration: none;
    }

    .footer-item.active {
      color: #5a9cf5;
    }

    .footer-icon img {
      display: block;
      width: clamp(22px, 6vw, 26px);
      height: clamp(22px, 6vw, 26px);
      object-fit: contain;
      margin-bottom: 3px;
    }

    /* 「我」tab 图标单独缩小一号：每边内缩 5% 框宽，外框不变不影响布局 */
    .footer-icon-sm {
      box-sizing: border-box;
      padding: calc(0.05 * clamp(22px, 6vw, 26px));
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- a. Banner -->
    <div class="banner-card">
      <img src="d_ad.png" alt="" />
    </div>

    <!-- b. 效率工具 -->
    <div class="section">
      <div class="section-title">效率工具</div>
      <div class="app-grid">
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-richeng.png" alt="" /></div>
          <div class="app-name">日程</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-huiyi.png" alt="" /></div>
          <div class="app-name">会议</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-weipan.png" alt="" /></div>
          <div class="app-name">微盘</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-wendang-grid.png" alt="" /></div>
          <div class="app-name">收集表</div>
        </div>
      </div>
    </div>

    <!-- d. 警院微应用 -->
    <div class="section">
      <div class="section-title">警院微应用</div>
      <div class="app-grid">
        <a href="waiting.html?target=workshop.html" class="app-item">
          <div class="app-icon"><img src="icons/icon-zhangshangxiaoyuan.png" alt="" /></div>
          <div class="app-name">掌上校园</div>
        </a>
      </div>
    </div>

    <!-- c. 智能办公AI+ -->
    <div class="section">
      <div class="section-title">智能办公AI+</div>
      <div class="app-grid">
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-zhinengwendang.png" alt="" /></div>
          <div class="app-name">智能文档</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-zhinengbiaoge.png" alt="" /></div>
          <div class="app-name">智能表格</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-zhinengzongjie.png" alt="" /></div>
          <div class="app-name">智能总结</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-zhinengjiqiren.png" alt="" /></div>
          <div class="app-name">智能机器人</div>
          <div class="app-tag">AI+</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-jilumianliao.png" alt="" /></div>
          <div class="app-name">记录面聊</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-fuwuzongjie.png" alt="" /></div>
          <div class="app-name">服务总结</div>
        </div>
      </div>
    </div>

    <!-- 无标题栏：企业小助手 / 手机版 -->
    <div class="section">
      <div class="app-grid">
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-qiyezhanghao.png" alt="" /></div>
          <div class="app-name">企业小助手</div>
        </div>
        <div class="app-item">
          <div class="app-icon"><img src="icons/icon-shoujiban.png" alt="" class="icon-inset" /></div>
          <div class="app-name">手机版</div>
        </div>
      </div>
    </div>
  </div>

  <!-- e. 底部工具栏 -->
  <div class="footer">
    <a href="#" class="footer-item">
      <div class="footer-icon"><img src="icons/icon-tab-xiaoxi.png" alt="" /></div>
      <span>消息</span>
    </a>
    <a href="#" class="footer-item">
      <div class="footer-icon"><img src="icons/icon-tab-wendang.png" alt="" /></div>
      <span>文档</span>
    </a>
    <a href="#" class="footer-item">
      <div class="footer-icon"><img src="icons/icon-tab-tongxunlu.png" alt="" /></div>
      <span>通讯录</span>
    </a>
    <a href="#" class="footer-item active">
      <div class="footer-icon"><img src="icons/icon-tab-gongzuotai.png" alt="" /></div>
      <span>工作台</span>
    </a>
    <a href="#" class="footer-item">
      <div class="footer-icon"><img src="icons/icon-tab-wo.png" alt="" class="footer-icon-sm" /></div>
      <span>我</span>
    </a>
  </div>
</body>
</html>
