<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            padding-top: calc(20px + env(safe-area-inset-top));
            -webkit-font-smoothing: antialiased;
        }

        .container { width: 100%; max-width: 414px; }

        /* 品牌区 */
        .brand { text-align: center; margin-bottom: 24px; }

        .brand-logo {
            width: 56px; height: 56px;
            margin: 0 auto 12px;
            border-radius: 14px;
            background: #eaf2fe;
            display: flex; align-items: center; justify-content: center;
        }

        .brand-logo svg { width: 28px; height: 28px; color: #5a9cf5; }

        .brand-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c3138;
            letter-spacing: .5px;
        }

        .brand-sub {
            font-size: 13px;
            color: #909399;
            margin-top: 6px;
        }

        /* 表单卡片 */
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
            padding: 24px;
            animation: fadeIn .4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #606266;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            font-size: 15px;
            color: #2c3138;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
            outline: none;
            -webkit-appearance: none;
        }

        .form-group input::placeholder { color: #c0c4cc; }

        .form-group input:focus {
            border-color: #5a9cf5;
            box-shadow: 0 0 0 3px rgba(90,156,245,.12);
        }

        .login-btn {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            background: #5a9cf5;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .2s;
        }

        .login-btn:hover { background: #4a8ce8; }
        .login-btn:active { background: #4a8ce8; }
        .login-btn:disabled { background: #a9cbf8; cursor: not-allowed; }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #909399;
            line-height: 1.8;
        }

        .links a {
            color: #5a9cf5;
            text-decoration: none;
            font-size: 13px;
        }

        .links a.sub { color: #c0c4cc; font-size: 13px; }

        /* 顶部白色小卡片提示（带图标） */
        .toast {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-72px);
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100% - 40px);
            padding: 10px 16px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,.12);
            font-size: 14px;
            font-weight: 500;
            color: #2c3138;
            z-index: 9999;
            transition: transform .3s ease;
            pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        .toast::before {
            content: '!';
            width: 18px; height: 18px;
            border-radius: 50%;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background: #f56c6c;
            margin-right: 8px;
        }

        .toast.success::before { content: '✓'; background: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </div>
            <div class="brand-title">请假管理系统</div>
            <div class="brand-sub">请使用您的工号账号登录</div>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button class="login-btn" id="loginBtn" onclick="handleLogin()">登录</button>
            <div class="links">
                没有账号？<a href="register.html">去注册</a>
                <br>
                <a href="admin.html" class="sub">进入后台管理</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://hqoeptonghttbqggpcwx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ShrC-Qjx3-V_cfIcrYgqWw_HEp4pE_-';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        window.handleLogin = async function() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                showToast('请填写用户名和密码');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                // 调用数据库函数验证登录（密码在数据库内核对，不再把哈希下载到浏览器）
                const { data: loginData, error: rpcError } = await supabase.rpc('auth_login', {
                    p_username: username,
                    p_password: password,
                    p_user_agent: navigator.userAgent
                });
                const loginRes = (loginData && typeof loginData === 'object') ? loginData : null;

                if (rpcError || !loginRes || loginRes.error) {
                    showToast('登录失败：' + ((loginRes && loginRes.error) || '账号或密码错误'));
                    btn.disabled = false;
                    btn.textContent = '登录';
                    return;
                }

                // 存储登录状态到 localStorage
                localStorage.setItem('leave_user', JSON.stringify(loginRes.user));
                // 每次登录重置业务数据，回到演示模板
                localStorage.removeItem('leaveConfig');

                // 管理后台凭证（管理员密码的 SHA-256），普通用户存着也无害
                const encoder = new TextEncoder();
                const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(password));
                localStorage.setItem('leave_token', Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join(''));

                showToast('登录成功', 'success');
                setTimeout(() => {
                    window.location.replace('home.html');
                }, 500);

            } catch (error) {
                console.error(error);
                showToast('登录失败：' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        };

        // 回车登录
        document.getElementById('username').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
