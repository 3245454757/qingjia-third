<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>请使用安卓 App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            padding-top: calc(44px + env(safe-area-inset-top) + 20px);
            -webkit-font-smoothing: antialiased;
        }

        /* 自绘顶栏（与全站一致） */
        .app-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(44px + env(safe-area-inset-top));
            padding-top: env(safe-area-inset-top);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-bottom: 1px solid #eef0f3;
            z-index: 1000;
        }

        .topbar-title { font-size: 16px; font-weight: 600; color: #2c3138; }

        .topbar-back {
            position: absolute;
            left: 6px;
            top: calc(env(safe-area-inset-top));
            width: 32px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3138;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar-back svg { width: 22px; height: 22px; }

        .container { width: 100%; max-width: 414px; }

        .brand { text-align: center; margin-bottom: 22px; }

        .brand-logo {
            width: 56px; height: 56px;
            margin: 0 auto 12px;
            border-radius: 14px;
            background: #eaf2fe;
            display: flex; align-items: center; justify-content: center;
        }

        .brand-logo svg { width: 28px; height: 28px; color: #5a9cf5; }

        .brand-title { font-size: 20px; font-weight: 600; color: #2c3138; letter-spacing: .5px; }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
            padding: 24px;
            text-align: center;
        }

        .card-title { font-size: 16px; font-weight: 600; color: #2c3138; margin-bottom: 8px; }

        .card-desc { font-size: 13px; color: #909399; line-height: 1.7; margin-bottom: 20px; }

        .download-btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: #5a9cf5;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(90,156,245,.3);
            -webkit-tap-highlight-color: transparent;
        }

        .download-btn:active { background: #4a8ae0; }

        .tips {
            margin-top: 18px;
            padding: 12px 14px;
            background: #fafbfd;
            border-left: 3px solid #5a9cf5;
            border-radius: 8px;
            text-align: left;
            font-size: 12px;
            color: #606266;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="app-topbar">
    <a class="topbar-back" href="login.html" aria-label="返回" onclick="location.href='login.html';return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="topbar-title">请使用 App</span>
</div>

<div class="container">
    <div class="brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
        </div>
        <div class="brand-title">请假系统</div>
    </div>

    <div class="card">
        <div class="card-title">本系统安卓端请使用 App 登录</div>
        <div class="card-desc">iOS 用户请在企业微信中打开网页版</div>
        <a class="download-btn" id="downloadBtn" href="#">下载安卓版 App</a>
        <div class="tips">
            ① 在企业微信里点右上角 ⋯ → 在浏览器中打开；<br>
            ② 下载后点安装，允许「安装未知来源应用」
        </div>
    </div>
</div>

<script>
    // APK 下载直链：apk 文件放 qingjia-download 仓库，同名覆盖即可，链接永不变化
    const APK_URL = 'https://3245454757.github.io/qingjia-download/qingjia.apk';

    document.getElementById('downloadBtn').href = APK_URL;
</script>
</body>
</html>
