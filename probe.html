<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壳接口探测页（临时，可删）</title>
<style>
  body { font-family: sans-serif; margin: 16px; font-size: 15px; line-height: 1.6; }
  .row { margin-bottom: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; word-break: break-all; }
  .label { color: #666; font-size: 13px; }
  .err { color: #c00; }
  .ok { color: #070; }
</style>
</head>
<body>
<h3>APK 壳接口探测（临时页面）</h3>
<div class="row"><span class="label">1. window.AndroidInterface 是否存在：</span><div id="r1">检测中…</div></div>
<div class="row"><span class="label">2. getAndroidId() 返回值：</span><div id="r2">未调用</div></div>
<div class="row"><span class="label">3. navigator.userAgent：</span><div id="r3">-</div></div>

<script>
(function () {
  // 1) 接口对象是否存在
  var r1 = document.getElementById('r1');
  try {
    if (window.AndroidInterface && typeof window.AndroidInterface.getAndroidId === 'function') {
      r1.innerHTML = '<span class="ok">存在</span>，且 getAndroidId 是函数';
    } else if (window.AndroidInterface) {
      r1.innerHTML = '<span class="err">存在，但 getAndroidId 不是函数</span>';
    } else {
      r1.innerHTML = '<span class="err">不存在</span>（可能不在壳的 WebView 中打开，或壳版本未更新）';
    }
  } catch (e) {
    r1.innerHTML = '<span class="err">检测异常: ' + (e && e.message ? e.message : e) + '</span>';
  }

  // 2) 调用 getAndroidId
  var r2 = document.getElementById('r2');
  try {
    var id = window.AndroidInterface.getAndroidId();
    r2.innerHTML = (id === '' || id === null)
      ? '<span class="err">返回为空</span>'
      : '<span class="ok">' + String(id).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
  } catch (e) {
    r2.innerHTML = '<span class="err">调用出错: ' + (e && e.message ? e.message : e) + '</span>';
  }

  // 3) UA
  var r3 = document.getElementById('r3');
  try {
    r3.textContent = navigator.userAgent;
  } catch (e) {
    r3.innerHTML = '<span class="err">读取出错: ' + (e && e.message ? e.message : e) + '</span>';
  }
})();
</script>
</body>
</html>
