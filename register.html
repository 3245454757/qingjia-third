<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
    (function(){var ua=navigator.userAgent||'';if(!/android/i.test(ua))return;if(/HtmlToApkShell/i.test(ua))return;var u=null;try{u=JSON.parse(localStorage.getItem('leave_user')||'null');}catch(e){}if(u&&u.role==='admin')return;location.replace('need-apk.html');})();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>注册账号</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            padding-top: calc(20px + env(safe-area-inset-top));
            -webkit-font-smoothing: antialiased;
        }

        .container { width: 100%; max-width: 414px; }

        /* 品牌区 */
        .brand { text-align: center; margin-bottom: 24px; }

        .brand-logo {
            width: 56px; height: 56px;
            margin: 0 auto 12px;
            border-radius: 14px;
            background: #eaf2fe;
            display: flex; align-items: center; justify-content: center;
        }

        .brand-logo svg { width: 28px; height: 28px; color: #5a9cf5; }

        .brand-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c3138;
            letter-spacing: .5px;
        }

        .brand-sub {
            font-size: 13px;
            color: #909399;
            margin-top: 6px;
        }

        /* 表单卡片 */
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
            padding: 24px;
            animation: fadeIn .4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #606266;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            font-size: 15px;
            color: #2c3138;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s;
            outline: none;
            -webkit-appearance: none;
        }

        .form-group input::placeholder { color: #c0c4cc; }

        .form-group .hint { font-size: 11px; color: #a0a4ab; margin-top: 6px; line-height: 1.5; }

        .form-group input:focus {
            border-color: #5a9cf5;
            box-shadow: 0 0 0 3px rgba(90,156,245,.12);
        }

        .register-btn {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            background: #5a9cf5;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .2s;
        }

        .register-btn:hover { background: #4a8ce8; }
        .register-btn:active { background: #4a8ce8; }
        .register-btn:disabled { background: #a9cbf8; cursor: not-allowed; }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #909399;
            line-height: 1.8;
        }

        .links a {
            color: #5a9cf5;
            text-decoration: none;
            font-size: 13px;
        }

        /* 审核中页面 */
        .pending-page {
            display: none;
            text-align: center;
            padding: 40px 24px;
        }

        .pending-page .pending-icon {
            width: 64px; height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #fdf4e6;
            display: flex; align-items: center; justify-content: center;
        }

        .pending-page .pending-icon svg { width: 32px; height: 32px; color: #f0a020; }

        .pending-page h2 {
            color: #2c3138;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .pending-page p {
            color: #909399;
            font-size: 13px;
            line-height: 1.9;
        }

        /* 顶部白色小卡片提示（带图标） */
        .toast {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-72px);
            display: flex;
            align-items: center;
            max-width: calc(100% - 40px);
            padding: 10px 16px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,.12);
            font-size: 14px;
            font-weight: 500;
            color: #2c3138;
            z-index: 9999;
            transition: transform .3s ease;
            pointer-events: none;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        .toast::before {
            content: '!';
            width: 18px; height: 18px;
            border-radius: 50%;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background: #f56c6c;
            margin-right: 8px;
        }

        .toast.success::before { content: '✓'; background: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </div>
            <div class="brand-title">请假管理系统</div>
            <div class="brand-sub">注册新账号并等待管理员审核</div>
        </div>

        <div class="card" id="registerForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
                <div class="hint">请使用本人真实姓名，注册后请假页面无法修改</div>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码（至少6位）" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="inviteCode">邀请码</label>
                <input type="text" id="inviteCode" placeholder="请输入邀请码" autocomplete="off">
            </div>
            <button class="register-btn" id="registerBtn" onclick="handleRegister()">注册</button>
            <div class="links">
                已有账号？<a href="login.html">去登录</a>
            </div>
        </div>

        <div class="card pending-page" id="pendingPage">
            <div class="pending-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </div>
            <h2>注册成功，等待审核</h2>
            <p>
                您的账号已提交，需要管理员审核后才能登录。<br>
                请耐心等待，审核通过后即可正常使用。
            </p>
            <div class="links" style="margin-top: 24px;">
                <a href="login.html">返回登录</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://hqoeptonghttbqggpcwx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ShrC-Qjx3-V_cfIcrYgqWw_HEp4pE_-';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        window.handleRegister = async function() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const inviteCode = document.getElementById('inviteCode').value.trim();
            const btn = document.getElementById('registerBtn');

            if (!username || !password || !inviteCode) {
                showToast('请填写所有字段');
                return;
            }

            if (password.length < 6) {
                showToast('密码至少6位');
                return;
            }

            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                // 调用数据库函数完成注册（查重、验证邀请码、写入都在数据库内进行）
                const { data: regData, error: regError } = await supabase.rpc('register_user', {
                    p_username: username,
                    p_password: password,
                    p_invite_code: inviteCode
                });
                const regRes = (regData && typeof regData === 'object') ? regData : null;

                if (regError || !regRes || regRes.error) {
                    showToast((regRes && regRes.error) || '注册失败，请稍后再试');
                    btn.disabled = false;
                    btn.textContent = '注册';
                    return;
                }

                // 清除可能存在的 Supabase Auth 会话
                await supabase.auth.signOut().catch(() => {});

                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('pendingPage').style.display = 'block';
            } catch (error) {
                console.error(error);
                showToast('注册失败：' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        };
    </script>
</body>
</html>
